openapi: 3.0.3
info:
  title: Practice Users API
  version: 1.0.0
paths:
  /users/{user_id}:
    get:
      summary: Get a user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
